name: Publish TRX with packaged PTR (Windows POC)

on:
  push:
    branches: [kathans/gh-tcm-oidc-poc]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'microsoft/azure-pipelines-coveragepublisher' && github.ref == 'refs/heads/kathans/gh-tcm-oidc-poc'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: powershell
    env:
      # Reuse the existing verify-ado-auth POC identity and target.
      CLIENT_ID: 5c299c5c-74de-4ce9-b943-98e12d31f858
      TENANT_ID: 72f988bf-86f1-41af-91ab-2d7cd011db47
      ADO_ORG_URL: https://dev.azure.com/tfspfcusctest
      ADO_PROJECT: TestAI

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare isolated workspace
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command az -ErrorAction Stop | Out-Null
          $root = Join-Path $env:RUNNER_TEMP ("ptr-job-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $root | Out-Null
          "PTR_WORK_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PTR_RESULTS_DIR=$root\TestResults" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AZURE_CONFIG_DIR=$root\azure" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract bundled publisher
        id: prepare
        run: |
          $exe = & .\tools\ptr\Prepare-Ptr.ps1 -Destination "$env:PTR_WORK_DIR\publisher"
          "PTR_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up SDK for existing net7.0 tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Run tests and generate TRX
        id: tests
        run: dotnet test .\src\CoveragePublisher.Tests\CoveragePublisher.Tests.csproj --logger trx --results-directory "$env:PTR_RESULTS_DIR"

      - name: Require test reports
        id: reports
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:PTR_RESULTS_DIR -PathType Container)) {
            throw 'The test runner did not create a results directory.'
          }
          $files = @(Get-ChildItem -LiteralPath $env:PTR_RESULTS_DIR -Filter '*.trx' -File -Recurse)
          if ($files.Count -eq 0) { throw 'The test runner did not produce any TRX files.' }
          Write-Host "Found $($files.Count) TRX file(s)."

      - name: Sign in with existing federation
        id: login
        if: ${{ !cancelled() && steps.reports.outcome == 'success' }}
        uses: azure/login@v2
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          audience: api://AzureADTokenExchange
          allow-no-subscriptions: true

      - name: Publish using TestResultsPublisher.exe
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken --output tsv --only-show-errors
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw 'Failed to acquire the ADO access token.'
          }
          try {
            & .\tools\ptr\Invoke-Ptr.ps1 `
              -PublisherPath $env:PTR_EXE `
              -ResultsDirectory $env:PTR_RESULTS_DIR `
              -TempDirectory $env:PTR_WORK_DIR `
              -CollectionUrl $env:ADO_ORG_URL `
              -ProjectName $env:ADO_PROJECT `
              -AccessToken $token `
              -RunTitle "GitHub PTR $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT"
          }
          finally {
            $token = $null
          }

      - name: Remove per-job publisher, reports and CLI cache
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PTR_WORK_DIR -and (Test-Path -LiteralPath $env:PTR_WORK_DIR)) {
            Remove-Item -LiteralPath $env:PTR_WORK_DIR -Recurse -Force
          }
