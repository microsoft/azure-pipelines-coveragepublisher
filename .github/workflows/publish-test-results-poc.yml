name: Publish test results action POC

on:
  push:
    branches: [kathans/gh-tcm-oidc-poc]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'microsoft/azure-pipelines-coveragepublisher' && github.ref == 'refs/heads/kathans/gh-tcm-oidc-poc'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      CLIENT_ID: 5c299c5c-74de-4ce9-b943-98e12d31f858
      TENANT_ID: 72f988bf-86f1-41af-91ab-2d7cd011db47
      ADO_ORG_URL: https://dev.azure.com/tfspfcusctest
      ADO_PROJECT: TestAI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            10.0.x

      - name: Run tests and generate TRX
        id: tests
        continue-on-error: true
        run: >
          dotnet test src/CoveragePublisher.Tests/CoveragePublisher.Tests.csproj
          --logger "trx;LogFileName=coveragepublisher.trx"
          --results-directory "${{ runner.temp }}/TestResults"

      - name: Publish TRX with tagged action
        id: publish
        if: always() && !cancelled()
        uses: haddanki-msft/ado-publish-test-results@v0.1.0
        with:
          results-dir: ${{ runner.temp }}/TestResults
          pattern: '*.trx'
          test-runner: VSTest
          collection-url: ${{ env.ADO_ORG_URL }}
          project: ${{ env.ADO_PROJECT }}
          run-title: GitHub tagged action POC - ${{ github.run_id }}
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          dry-run: 'false'

      - name: Show published run
        run: echo "ADO test run ${{ steps.publish.outputs.run-url }}"

      - name: Preserve test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
