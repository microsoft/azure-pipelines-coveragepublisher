name: verify-ado-auth
on:
  push:
    branches: [ kathans/gh-tcm-oidc-poc ]
permissions:
  id-token: write
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: 5c299c5c-74de-4ce9-b943-98e12d31f858
      TENANT_ID: 72f988bf-86f1-41af-91ab-2d7cd011db47
      ADO_RESOURCE: 499b84ac-1321-427f-aa17-267ca6975798
      ADO_ORG_URL: https://dev.azure.com/tfspfcusctest
      ADO_PROJECT: TestAI
      PUBLISH_PY_B64: 
      SAMPLE_TRX_B64: 
    steps:
      - name: OIDC -> Entra -> ADO -> TCM publish
        run: |
          set -euo pipefail
          printf '%s' "$PUBLISH_PY_B64" | base64 -d > tcm_publish.py
          printf '%s' "$SAMPLE_TRX_B64" | base64 -d > sample.trx

          echo "==== 1) Request GitHub OIDC token ===="
          GH_OIDC=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "GitHub OIDC token length: ${#GH_OIDC}"

          echo "==== 2) Exchange at Entra for ADO-scoped token ===="
          RESP=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" -d "grant_type=client_credentials" -d "client_id=$CLIENT_ID" -d "scope=$ADO_RESOURCE/.default" -d "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" --data-urlencode "client_assertion=$GH_OIDC")
          ADO_TOKEN=$(echo "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$ADO_TOKEN" ]; then echo "TOKEN EXCHANGE FAILED:"; echo "$RESP" | head -c 1200; echo; exit 1; fi
          echo "::add-mask::$ADO_TOKEN"
          echo "ADO access token length: ${#ADO_TOKEN}"

          echo "==== 3) Publish sample.trx to TCM (project $ADO_PROJECT) ===="
          ADO_TOKEN="$ADO_TOKEN" ADO_ORG_URL="$ADO_ORG_URL" ADO_PROJECT="$ADO_PROJECT" TRX_PATH=sample.trx python3 tcm_publish.py