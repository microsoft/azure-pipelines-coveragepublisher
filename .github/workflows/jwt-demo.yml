name: JWT Demo
on:
  push:
    branches:
      - "kathans/**"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  jwt-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pyjwt cryptography requests
      - run: python jwt_demo.py
        env:
          JWT_AUDIENCE: "api://AzureADTokenExchange"
